# Docker Compose for Legal Services Platform
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: legal_services_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legal_services}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - legal_services_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal_services_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-legal_services}
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app
    # Exposed internally; routed externally via Traefik
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - legal_services_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=legal_services_network"
      - "traefik.http.routers.backend.rule=(Host(`${DOMAIN}`) || Host(`${WWW_DOMAIN}`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.routers.backend.middlewares=sec-headers,compress,ratelimit@docker"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: legal_services_frontend
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:8000/api
      - NEXT_PUBLIC_API_BASE_URL=https://${DOMAIN}
    # Exposed internally; routed externally via Traefik
    depends_on:
      - backend
    networks:
      - legal_services_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=legal_services_network"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`) || Host(`${WWW_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=5000"
      - "traefik.http.routers.frontend.middlewares=sec-headers,compress,ratelimit@docker"

  # Development Frontend (alternative)
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: legal_services_frontend_dev
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:5000"
    depends_on:
      - backend
    networks:
      - legal_services_network
    profiles:
      - dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for rate limiting / caching
  redis:
    image: redis:7-alpine
    container_name: legal_services_redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - legal_services_network
    restart: unless-stopped

  # Traefik Reverse Proxy with Let's Encrypt
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=false"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - legal_services_network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Redirect all HTTP to HTTPS
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # Global security headers middleware
      - "traefik.http.middlewares.sec-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.sec-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.sec-headers.headers.referrerPolicy=no-referrer-when-downgrade"
      - "traefik.http.middlewares.sec-headers.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()"
      - "traefik.http.middlewares.sec-headers.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; connect-src 'self' https: *.onrender.com *.digitaloceanspaces.com; img-src 'self' data: blob: https: *.onrender.com *.digitaloceanspaces.com; style-src 'self' 'unsafe-inline'; font-src 'self' data: https: *.onrender.com *.digitaloceanspaces.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'"
      # Compression middleware
      - "traefik.http.middlewares.compress.compress=true"
      # Basic rate limiting
      - "traefik.http.middlewares.ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.ratelimit.ratelimit.burst=50"

volumes:
  postgres_data:
    driver: local
  letsencrypt:
    driver: local

networks:
  legal_services_network:
    driver: bridge